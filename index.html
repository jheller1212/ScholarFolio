<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free, open-source research profiles from Google Scholar: citation trends, h-index and i10-index, co-author network and field-normalized metrics on one shareable page." />
    <meta name="theme-color" content="#1e293b" />
    <!-- Defaults for any URL served this shell. The og-meta edge function
         swaps in per-page tags (and the canonical) for /, /about, ... and,
         for crawlers, per-researcher tags on profile URLs. No canonical here:
         this same file answers every profile URL, which must not point at /. -->
    <meta property="og:title" content="ScholarFolio — Your research, at a glance" />
    <meta property="og:description" content="Publication history, collaboration network, and research reach on one page." />
    <meta property="og:url" content="https://scholarfolio.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ScholarFolio" />
    <meta property="og:image" content="https://scholarfolio.org/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ScholarFolio — Your research, at a glance" />
    <meta name="twitter:description" content="Publication history, collaboration network, and research reach on one page." />
    <meta name="twitter:image" content="https://scholarfolio.org/og-default.png" />
    <title>ScholarFolio — Your research, at a glance</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ScholarFolio",
        "url": "https://scholarfolio.org/",
        "description": "Academic portfolio pages from Google Scholar profiles: citation trends, co-author networks, and field-normalized metrics."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ScholarFolio",
        "url": "https://scholarfolio.org/",
        "logo": "https://scholarfolio.org/logo.svg",
        "sameAs": ["https://github.com/jheller1212/ScholarFolio"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ScholarFolio",
        "url": "https://scholarfolio.org/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "Free, open-source research profiles from Google Scholar: citation trends, h-index and i10-index, co-author network, field-normalized metrics and narrative CV drafts.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "license": "https://opensource.org/licenses/MIT",
        "isAccessibleForFree": true
      }
    </script>
    <!-- Fonts are self-hosted (see src/fonts.css) so no visitor IP reaches
         Google. Preload the two most-used faces to avoid a flash. -->
    <link rel="preload" href="/fonts/dm-sans-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-700-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Readable without JavaScript: answer engines and other fetchers that don't
         run JS see this on every route; browsers ignore it. Keep in step with
         LandingSeoSections. Profile routes additionally get per-researcher text
         from the og-meta edge function. -->
    <noscript>
      <main style="max-width:640px;margin:2rem auto;padding:1rem;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;">
        <h1>ScholarFolio: academic research profiles</h1>
        <p>ScholarFolio is a free, open source citation metrics dashboard and academic portfolio for researchers. It turns a public Google Scholar profile into one page with citation trends, an interactive co-author network, h-index and i10-index, and field-normalized metrics. Researchers can claim a profile, verify it with their ORCID iD, and share one permanent URL.</p>
        <p>Publication and citation data come from public Google Scholar profiles, enriched with open data from OpenAlex and Semantic Scholar. Profile pages live at <code>scholarfolio.org/scholar/&lt;Google Scholar user ID&gt;</code>.</p>
        <p>The interactive app needs JavaScript. These pages do not all require it:</p>
        <ul>
          <li><a href="/guides/">Narrative CV guides</a> for NWO, ERC, MSCA, UKRI, SNSF and DFG applications</li>
          <li><a href="/about">About</a> · <a href="/changelog">Changelog</a></li>
          <li><a href="/privacy">Privacy Policy</a> — how we collect, use, and protect your data (GDPR rights, cookies, first-party analytics)</li>
          <li><a href="/terms">Terms of Service</a></li>
        </ul>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
