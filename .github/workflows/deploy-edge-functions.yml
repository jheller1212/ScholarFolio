name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        # Enumerate the directory so a new function is never silently left undeployed.
        # Every ScholarFolio function needs --no-verify-jwt; they do their own auth checks.
        run: |
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            case "$fn" in _*) continue ;; esac
            [ -f "$dir/index.ts" ] || continue
            echo "Deploying $fn"
            supabase functions deploy "$fn" --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
