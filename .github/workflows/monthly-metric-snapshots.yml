name: Monthly metric snapshots

# Captures each verified profile's metrics once a month, then sends the
# citation digest that diffs them. pg_net isn't installed, so we trigger the
# edge functions from GitHub's scheduler instead of pg_cron.
#
# Manual runs default to a digest DRY RUN (lists who would get an email, sends
# nothing). Untick "digest_dry_run" to send for real. The snapshot step is an
# idempotent upsert, so re-running it in the same month is safe.

on:
  schedule:
    - cron: '0 4 1 * *'   # 04:00 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      digest_dry_run:
        description: 'Digest dry run (list recipients, send nothing)'
        type: boolean
        default: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Run snapshot
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://$REF.supabase.co/functions/v1/snapshot-metrics" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"

      - name: Send citation digest
        env:
          # Scheduled runs send; manual runs follow the checkbox (default: dry run).
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.digest_dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then payload='{"dryRun":true}'; else payload='{}'; fi
          echo "Payload: $payload"
          code=$(curl -s -o /tmp/digest.json -w '%{http_code}' -X POST \
            "https://$REF.supabase.co/functions/v1/send-digest" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data "$payload")
          echo "HTTP $code"; cat /tmp/digest.json; echo
          test "$code" = "200"
