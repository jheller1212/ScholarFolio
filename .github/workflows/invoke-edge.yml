name: Invoke edge function

# Ops utility: invoke a CRON_SECRET-gated edge function (send-claim-nudge,
# snapshot-metrics, ...) for testing. Dispatch-only.

on:
  workflow_dispatch:
    inputs:
      fn:
        description: 'Edge function name (e.g. send-claim-nudge)'
        required: true
      payload:
        description: 'JSON body'
        required: true
        default: '{}'

jobs:
  invoke:
    runs-on: ubuntu-latest
    env:
      REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Invoke
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://$REF.supabase.co/functions/v1/${{ github.event.inputs.fn }}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '${{ github.event.inputs.payload }}')
          echo "HTTP $code"; cat /tmp/out.json; echo
          test "$code" = "200"
