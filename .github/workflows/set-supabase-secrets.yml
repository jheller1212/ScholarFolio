name: Set Supabase edge secrets

# Pushes selected GitHub secrets into the Supabase project's edge-function
# secrets, using the same SUPABASE_ACCESS_TOKEN that deploys the functions.
# Manual-trigger only. GitHub masks secret values in the logs.

on:
  workflow_dispatch: {}

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Set edge secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase secrets set "RESEND_API_KEY=$RESEND_API_KEY" "CRON_SECRET=$CRON_SECRET" --project-ref "$REF"
          echo "RESEND_API_KEY + CRON_SECRET set on $REF"
